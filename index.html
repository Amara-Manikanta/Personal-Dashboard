<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Life Tracker - Novels & Travel</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <!-- Babel 7: v6 predates optional chaining (?.) and nullish coalescing (??),
         so any component using them failed to parse and silently vanished. -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

    <!-- Icons (Phosphor) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="premium-overrides.css">

    <!-- Third Party Libraries -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

</head>

<body class="bg-surface text-text-primary">
    <div id="root"></div>

    <!-- App Scripts -->
    <!-- We use type="text/babel" for JSX support -->
    <!-- API Utility -->
    <script type="text/babel" data-presets="react" src="src/api.js?v=5.7"></script>

    <script type="text/babel" data-presets="react" src="src/components/AuthorPage.jsx?v=5.7"></script>
